{{- if not .Values.email }}
{{- fail "email is required for the Let's Encrypt account" }}
{{- end }}
{{- $issuers := dict "letsencrypt-staging" "https://acme-staging-v02.api.letsencrypt.org/directory" "letsencrypt-prod" "https://acme-v02.api.letsencrypt.org/directory" }}
{{- range $name, $server := $issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    server: {{ $server }}
    email: {{ $.Values.email }}
    privateKeySecretRef:
      name: {{ $name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ $.Values.ingressClass }}
{{- end }}
