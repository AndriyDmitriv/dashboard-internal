image:
  repository: lscr.io/linuxserver/wireguard
  tag: 1.0.20260223-r0-ls129
  pullPolicy: IfNotPresent

# privileged init: sets net.ipv4.ip_forward (not a safe sysctl)
sysctlInit:
  image: busybox:1.36.1

server:
  url: "" # required
  port: 51820
  peers: "admin" # names, comma-separated
  peerDns: "auto"
  internalSubnet: 10.13.13.0
  allowedIps: "10.13.13.0/24"
  persistentKeepalive: "25"
  timezone: Etc/UTC

service:
  type: LoadBalancer
  annotations: {}
  loadBalancerSourceRanges: [] # empty = any
  externalTrafficPolicy: Cluster

# keys live here; without it they regenerate on restart
persistence:
  enabled: true
  size: 1Gi
  storageClassName: "" # empty = default

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
