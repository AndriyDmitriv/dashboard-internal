nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 1
  image:
    repository: internal-dashboard-api
    tag: local
    pullPolicy: IfNotPresent
  service:
    port: 8000
    targetPort: 8000
  containerPort: 8000
  resources:
    requests:
      cpu: 50m
      memory: 8Mi
    limits:
      cpu: 200m
      memory: 160Mi
  probes:
    liveness:
      path: /api/health
      port: 8000
      initialDelaySeconds: 5
      periodSeconds: 3
      timeoutSeconds: 1
      failureThreshold: 2
    readiness:
      path: /api/ready
      port: 8000
      initialDelaySeconds: 3
      periodSeconds: 3
      timeoutSeconds: 1
      failureThreshold: 2

web:
  replicaCount: 1
  image:
    repository: caddy
    tag: 2-alpine
    pullPolicy: Always
  frontend:
    repository: internal-dashboard-frontend
    tag: local
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 80
  containerPort: 80
  caddyRoot: /srv/www/dist

redis:
  replicaCount: 1
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: Always
  port: 6379

ingress:
  enabled: true
  className: traefik
  host: dashboard.local
  stripApiPrefix: false

networkPolicy:
  enabled: true
  apiIngressPort: 8000
  redisIngressPort: 6379
  traefikNamespace: kube-system

quota:
  enabled: true
